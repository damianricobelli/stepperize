name: Checks
on:
  pull_request:
  push:
    branches: [main, v8]
permissions:
  contents: read
jobs:
  react:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react: [18, 19]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stepperize/react exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter @stepperize/core build
      - run: pnpm --filter @stepperize/core typecheck
      - run: pnpm --filter @stepperize/core exec vitest run
      - run: node scripts/test-react-compat.mjs ${{ matrix.react }}
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stepperize/react exec playwright install --with-deps --only-shell chromium
      - run: pnpm turbo build --filter=@stepperize/react...
      - run: node scripts/check-bundle.mjs
      - run: pnpm lint
      - run: pnpm --filter docs registry:build
      - run: pnpm --filter docs exec tsc --noEmit
      - run: pnpm --filter docs test
      - run: pnpm --filter docs build
